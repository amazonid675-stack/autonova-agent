name: Android validation

on:
  pull_request:
    paths:
      - "android/Autonova/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main, develop]
    paths:
      - "android/Autonova/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  test-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/Autonova
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate temporary Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Run Android unit tests and compile instrumentation tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Execute Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Keep API 35 for compilation, and run the instrumentation suite on API 34.
          # AGP 8.5.2 can misread the emulator as API 1 when it installs a split package.
          # Explicit ADB installation avoids that runner/AGP integration defect.
          api-level: 34
          arch: x86_64
          script: |
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            adb shell getprop ro.build.version.sdk
            adb shell settings put global verifier_verify_adb_installs 0 || true
            adb shell settings put global package_verifier_enable 0 || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e clearPackageData true im.autonova.mobile.test/androidx.test.runner.AndroidJUnitRunner
      - name: Upload verified Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autonova-debug-apk
          path: android/Autonova/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
