name: Android validation

on:
  pull_request:
    paths:
      - "android/Autonova/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main, develop]
    paths:
      - "android/Autonova/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  test-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/Autonova
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate temporary Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Run Android unit tests and compile instrumentation tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Execute Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 35's device installer rejects this debug APK as a split package under AGP 8.5.2.
          # Keep API 35 for compilation, and execute the secure-config instrumentation suite on API 34.
          api-level: 34
          arch: x86_64
          script: |
            adb wait-for-device
            adb shell settings put global verifier_verify_adb_installs 0
            adb shell settings put global package_verifier_enable 0
            cd android/Autonova && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload verified Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autonova-debug-apk
          path: android/Autonova/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
