name: Android validation

on:
  pull_request:
    paths:
      - "android/Autonova/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main, develop]
    paths:
      - "android/Autonova/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  test-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/Autonova
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate temporary Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Run Android unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
